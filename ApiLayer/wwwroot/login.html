<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Finance API Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
            margin: 0;
        }

        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 320px;
        }

            .login-box h2 {
                text-align: center;
                margin-bottom: 20px;
                color: #333;
            }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0d6efd;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

            button:hover {
                background: #0b5ed7;
            }

        #errorMsg {
            color: #dc3545;
            text-align: center;
            margin-top: 10px;
            display: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Giris</h2>
        <input type="text" id="username" placeholder="Kullanıcı Adı" />
        <input type="password" id="password" placeholder="Şifre" />
        <button id="btnLogin">Giriş Yap</button>
        <div id="errorMsg"></div>
    </div>

    <script>
        document.getElementById('btnLogin').addEventListener('click', async function () {
            var user = document.getElementById('username').value;
            var pass = document.getElementById('password').value;
            var errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/api/Auth/Login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const result = await response.json();
                const jwtToken = result.token || result.Token;

                if (response.ok && jwtToken) {
                    window.opener.postMessage({ token: jwtToken }, '*');
                } else {
                    errorMsg.innerText = result.message || result.Message || "Giriş başarısız.";
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.innerText = "Sunucuya bağlanılamadı.";
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
